<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>九曜界是什麼？｜九曜：天墟 世界觀短篇 S01</title>
<style>
  html, body { margin: 0; height: 100%; background: #05080b; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: 100vh; max-width: 100vw; aspect-ratio: 9 / 16; display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// 世界觀短篇 S01：九曜界是什麼？（30 秒、9:16、純程式動畫）
// 內容只用 docs/21 的「表層認知＋前期官方說法」，不揭露中層／長期真相。
// renderFrame(t) 是純函數（同一個 t 永遠畫出同一格），render.mjs 逐格呼叫輸出 MP4。
const W = 1080, H = 1920, DURATION = 30;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const C = {
  ink: '#07090c', teal: '#0f2a2e', blue: '#10213a', brown: '#2a2119',
  gold: [214, 168, 74], red: [192, 57, 43], spirit: [168, 226, 214], paper: [239, 230, 210],
};
const FONT = '"Noto Serif CJK TC","Noto Serif TC","Source Han Serif TC","PMingLiU",serif';

function rng(seed) { // mulberry32
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const rgba = (c, a) => `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const mix = (c1, c2, k) => [lerp(c1[0], c2[0], k), lerp(c1[1], c2[1], k), lerp(c1[2], c2[2], k)];
// 在 [a,b] 區間可見，淡入 fi 秒、淡出 fo 秒
const win = (t, a, b, fi = 0.5, fo = 0.5) => clamp((t - a) / fi) * clamp((b - t) / fo);

// ---------- 預先產生的靜態資料 ----------
const grain = (() => {
  const g = document.createElement('canvas'); g.width = 540; g.height = 960;
  const gx = g.getContext('2d'); const img = gx.createImageData(540, 960); const r = rng(7);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = 128 + (r() - 0.5) * 60;
    img.data[i] = v; img.data[i + 1] = v * 0.97; img.data[i + 2] = v * 0.9; img.data[i + 3] = 22;
  }
  gx.putImageData(img, 0, 0); return g;
})();

const blooms = (() => {
  const r = rng(11), list = [];
  for (let i = 0; i < 14; i++) list.push({
    x: 540 + (r() - 0.5) * 900, y: 700 + (r() - 0.5) * 1100, t0: r() * 3.2,
    rad: 220 + r() * 420, col: r() < 0.7 ? [16, 42, 46] : [30, 36, 64],
    lobes: Array.from({ length: 5 }, () => [(r() - 0.5) * 0.9, (r() - 0.5) * 0.9, 0.45 + r() * 0.5]),
  });
  return list;
})();

const CX = 540, CY = 820, VR = 600;
function veinPoint(i, s, t, jitter) {
  const a0 = -Math.PI / 2 + i * 2 * Math.PI / 9;
  const a = a0 + 0.42 * Math.sin(s * 3.1 + i * 1.7 + t * 0.25) * s;
  let r = 70 + s * VR;
  let x = CX + Math.cos(a) * r, y = CY + Math.sin(a) * r * 1.05;
  if (jitter) { x += Math.sin(s * 40 + t * 23 + i) * jitter; y += Math.cos(s * 37 + t * 19 + i * 2) * jitter; }
  return [x, y];
}

const rift = (() => {
  const r = rng(23), pts = [];
  for (let k = 0; k <= 16; k++) pts.push([90 + k * 900 / 16, 360 - k * 4 + (r() - 0.5) * 60]);
  return pts;
})();

const riftW = (() => { const r = rng(29); return Array.from({ length: 17 }, () => 22 + r() * 58); })();

const debris = (() => {
  const r = rng(31);
  return Array.from({ length: 70 }, () => ({ x: r() * W, y: 500 + r() * 1100, sp: 0.3 + r() * 0.7, sz: 1.5 + r() * 4, ph: r() }));
})();

function ridge(seed, base, amp) {
  const r = rng(seed), f = [r() * 6, r() * 6, r() * 6];
  return x => base - amp * (0.55 * Math.sin(x / 210 + f[0]) + 0.3 * Math.sin(x / 97 + f[1]) + 0.15 * Math.sin(x / 41 + f[2]) + 0.6);
}
const ridges = [ridge(41, 1180, 170), ridge(43, 1300, 130), ridge(47, 1440, 90)];
// 中景山稜正中央抬高成天玄院所在的主峰
const peak = x => ridges[1](x) - 240 * Math.exp(-Math.pow((x - 540) / 170, 2));

// ---------- 各圖層 ----------
function drawBackground(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, C.ink); g.addColorStop(0.55, C.blue); g.addColorStop(1, C.teal);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const b of blooms) {
    const age = t - b.t0; if (age <= 0) continue;
    const grow = 1 - Math.exp(-age * 1.1), a = 0.55 * clamp(age / 0.6) * (1 - clamp((t - 24) / 6) * 0.5);
    for (const [ox, oy, s] of b.lobes) {
      const rr = b.rad * s * grow, x = b.x + ox * b.rad * grow, y = b.y + oy * b.rad * grow;
      const rg = ctx.createRadialGradient(x, y, 0, x, y, rr);
      rg.addColorStop(0, rgba(b.col, a)); rg.addColorStop(1, rgba(b.col, 0));
      ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(x, y, rr, 0, Math.PI * 2); ctx.fill();
    }
  }
}

const motes = (() => {
  const r = rng(61);
  return Array.from({ length: 90 }, () => ({ x: r() * W, y: r() * H, sp: 20 + r() * 50, sz: 1 + r() * 3, ph: r() * 6.28 }));
})();
function drawMotes(t) { // 飄升的靈光微塵
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const m of motes) {
    const y = ((m.y - t * m.sp) % H + H) % H, x = m.x + Math.sin(t * 0.7 + m.ph) * 18;
    const tw = 0.5 + 0.5 * Math.sin(t * 2 + m.ph);
    ctx.fillStyle = rgba(C.gold, (0.25 + 0.45 * tw) * clamp(t / 1.2));
    ctx.beginPath(); ctx.arc(x, y, m.sz, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function drawVeins(t) {
  const show = clamp((t - 4.5) / 0.4) * (1 - ease((t - 22) / 1.8));
  if (show <= 0) return;
  const unstable = ease((t - 16.2) / 1.5);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 9; i++) {
    const p = easeOut((t - 4.6 - i * 0.18) / 2.2); if (p <= 0) continue;
    const bad = unstable * (i % 3 === 1 ? 1 : 0.45);
    const flick = 1 - bad * 0.6 * (0.5 + 0.5 * Math.sin(t * (17 + i * 3) + i));
    const col = mix(C.gold, C.red, bad);
    const jit = bad * 9;
    for (const [w, a] of [[16, 0.08], [7, 0.22], [2.2, 0.9]]) {
      ctx.strokeStyle = rgba(w < 3 ? mix(col, C.paper, 0.35) : col, a * show * flick);
      ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath();
      for (let k = 0; k <= 60; k++) {
        const s = k / 60 * p; const [x, y] = veinPoint(i, s, t, jit);
        k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.stroke();
    }
    for (let k = 0; k < 7; k++) { // 沿曜脈流動的光點
      const s = (k / 7 + t * 0.09 + i * 0.05) % 1; if (s > p) continue;
      const [x, y] = veinPoint(i, s, t, jit);
      const rg = ctx.createRadialGradient(x, y, 0, x, y, 14);
      rg.addColorStop(0, rgba(mix(col, C.paper, 0.6), 0.9 * show * flick)); rg.addColorStop(1, rgba(col, 0));
      ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(x, y, 14, 0, Math.PI * 2); ctx.fill();
    }
  }
  // 中央曜核：九個節點的環
  const core = easeOut((t - 5) / 1.5) * show;
  const pulse = 1 + 0.06 * Math.sin(t * 2.4);
  ctx.strokeStyle = rgba(C.gold, 0.55 * core); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(CX, CY, 70 * pulse, 0, Math.PI * 2); ctx.stroke();
  for (let i = 0; i < 9; i++) {
    const [x, y] = veinPoint(i, 0, t, 0);
    ctx.fillStyle = rgba(mix(C.gold, C.paper, 0.5), 0.9 * core);
    ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fill();
  }
  const rg = ctx.createRadialGradient(CX, CY, 0, CX, CY, 150);
  rg.addColorStop(0, rgba(C.gold, 0.35 * core)); rg.addColorStop(1, rgba(C.gold, 0));
  ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(CX, CY, 150, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawContract(t) { // 契點：修行者的光點升起、連上曜脈
  const a = win(t, 11, 16.4, 0.5, 0.6); if (a <= 0) return;
  const rise = easeOut((t - 11.2) / 1.8);
  const [tx, ty] = veinPoint(5, 0.62, t, 0);
  const sx = 400, sy = lerp(1700, 1300, rise);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const link = ease((t - 12.8) / 0.9);
  if (link > 0) {
    ctx.strokeStyle = rgba(C.spirit, 0.8 * a); ctx.lineWidth = 3; ctx.beginPath();
    ctx.moveTo(sx, sy); ctx.quadraticCurveTo(sx - 60, lerp(sy, ty, 0.5), lerp(sx, tx, link), lerp(sy, ty, link)); ctx.stroke();
    for (let k = 0; k < 3; k++) { // 連結瞬間的漣漪
      const age = t - 13.7 - k * 0.35; if (age < 0) continue;
      const rr = age * 160, al = clamp(1 - age / 1.4) * a;
      ctx.strokeStyle = rgba(C.spirit, 0.5 * al); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(tx, ty, rr, 0, Math.PI * 2); ctx.stroke();
    }
  }
  const rg = ctx.createRadialGradient(sx, sy, 0, sx, sy, 60);
  rg.addColorStop(0, rgba(C.spirit, 0.95 * a)); rg.addColorStop(0.25, rgba(C.spirit, 0.4 * a)); rg.addColorStop(1, rgba(C.spirit, 0));
  ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(sx, sy, 60, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawRift(t) {
  const open = ease((t - 16) / 1.2) * 0.75 + ease((t - 26.5) / 1.5) * 0.35;
  if (open <= 0) return;
  const breathe = 1 + 0.08 * Math.sin(t * 3.3);
  const wAt = k => Math.sin(Math.PI * k / 16) * riftW[k] * open * breathe;
  ctx.save();
  // 外圍朱紅光暈
  ctx.globalCompositeOperation = 'lighter';
  const halo = ctx.createRadialGradient(540, 330, 0, 540, 330, 520);
  halo.addColorStop(0, rgba(C.red, 0.35 * open)); halo.addColorStop(1, rgba(C.red, 0));
  ctx.fillStyle = halo; ctx.fillRect(0, 0, W, 900);
  ctx.globalCompositeOperation = 'source-over';
  ctx.beginPath();
  rift.forEach(([x, y], k) => { k ? ctx.lineTo(x, y - wAt(k)) : ctx.moveTo(x, y); });
  for (let k = 16; k >= 0; k--) ctx.lineTo(rift[k][0], rift[k][1] + wAt(k) * 0.8);
  ctx.closePath();
  const fill = ctx.createLinearGradient(0, 250, 0, 430);
  fill.addColorStop(0, '#f3ede0'); fill.addColorStop(0.5, rgba(C.spirit, 1)); fill.addColorStop(1, '#f3ede0');
  ctx.fillStyle = fill; ctx.shadowColor = rgba(C.red, 0.9); ctx.shadowBlur = 40 * open; ctx.fill();
  ctx.shadowBlur = 0; ctx.strokeStyle = rgba(C.red, 0.9); ctx.lineWidth = 3; ctx.stroke();
  // 細小裂紋
  const r = rng(53);
  ctx.strokeStyle = rgba(C.red, 0.55 * open); ctx.lineWidth = 1.5;
  for (let k = 1; k < 16; k += 2) {
    let [x, y] = rift[k]; ctx.beginPath(); ctx.moveTo(x, y);
    const dir = r() < 0.5 ? -1 : 1, len = 3 + (r() * 4 | 0);
    for (let j = 0; j < len * open; j++) { x += (r() - 0.5) * 50; y += dir * (15 + r() * 25); ctx.lineTo(x, y); }
    ctx.stroke();
  }
  // 被吸向裂口的碎屑
  ctx.globalCompositeOperation = 'lighter';
  for (const d of debris) {
    const ph = (d.ph + t * d.sp * 0.25) % 1;
    const x = lerp(d.x, 540 + (d.x - 540) * 0.3, ph), y = lerp(d.y, 340, ph * ph);
    ctx.fillStyle = rgba(ph > 0.6 ? C.spirit : C.red, 0.7 * open * (1 - ph));
    ctx.fillRect(x, y, d.sz, d.sz);
  }
  ctx.restore();
}

function drawMountains(t) {
  const up = easeOut((t - 21.8) / 2.2); if (up <= 0) return;
  const off = (1 - up) * 260;
  const layers = [[ridges[0], '#16262c', 0.9], [peak, '#0e1a1f', 1], [ridges[2], '#070b0e', 1]];
  layers.forEach(([f, col, a], li) => {
    ctx.fillStyle = col; ctx.globalAlpha = a * up; ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 12) ctx.lineTo(x, f(x) + off * (1 + li * 0.3));
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
    if (li === 1) drawGate(peak(540) + off * 1.3, up);
    if (li < 2) { // 山間雲霧
      const my = f(540) + 80 + off, mg = ctx.createLinearGradient(0, my - 60, 0, my + 60);
      mg.addColorStop(0, 'rgba(200,215,210,0)'); mg.addColorStop(0.5, `rgba(200,215,210,${0.06 * up})`); mg.addColorStop(1, 'rgba(200,215,210,0)');
      ctx.fillStyle = mg; ctx.fillRect(-40 + Math.sin(t * 0.3 + li) * 30, my - 60, W + 80, 120);
    }
  });
  ctx.globalAlpha = 1;
  drawFigures(ridges[2](540) + off * 1.6, up);
}

function drawGate(baseY, a) { // 天玄院山門剪影（原創造型：雙柱、雙層翹簷）
  ctx.save(); ctx.translate(540, baseY + 6); ctx.fillStyle = '#0a1317';
  ctx.fillRect(-58, -120, 14, 120); ctx.fillRect(44, -120, 14, 120);
  ctx.fillRect(-72, -104, 144, 10);
  for (const [yy, hw, lift] of [[-126, 96, 22], [-160, 70, 16]]) {
    ctx.beginPath(); ctx.moveTo(-hw, yy + 10);
    ctx.quadraticCurveTo(-hw * 0.6, yy + 2, -hw * 0.35, yy - 10); ctx.lineTo(hw * 0.35, yy - 10);
    ctx.quadraticCurveTo(hw * 0.6, yy + 2, hw, yy + 10); ctx.lineTo(hw + 8, yy + 10 - lift);
    ctx.lineTo(hw * 0.9, yy + 16); ctx.lineTo(-hw * 0.9, yy + 16); ctx.lineTo(-hw - 8, yy + 10 - lift);
    ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = rgba(C.gold, 0.8 * a); ctx.fillRect(-12, -98, 24, 30); // 門內燈火
  const g = ctx.createRadialGradient(0, -80, 0, 0, -80, 90);
  g.addColorStop(0, rgba(C.gold, 0.35 * a)); g.addColorStop(1, rgba(C.gold, 0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, -80, 90, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawFigures(groundY, a) { // 前景崖邊三名新契修的小剪影（背影，不對應特定角色）
  ctx.save(); ctx.fillStyle = `rgba(3,5,7,${a})`;
  [[470, 1, 0], [540, 1.08, 1], [612, 0.96, 2]].forEach(([x, s, kind]) => {
    ctx.save(); ctx.translate(x, groundY + 8); ctx.scale(s, s);
    ctx.beginPath(); ctx.arc(0, -86, 11, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-10, -74); ctx.lineTo(10, -74); ctx.lineTo(22, 0); ctx.lineTo(-22, 0); ctx.closePath(); ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = ctx.fillStyle;
    if (kind === 0) { ctx.beginPath(); ctx.moveTo(-18, -40); ctx.lineTo(-30, 4); ctx.stroke(); }
    if (kind === 2) { ctx.beginPath(); ctx.moveTo(8, -70); ctx.lineTo(-14, -20); ctx.stroke(); }
    ctx.restore();
  });
  ctx.restore();
}

function textBlock(str, y, size, alpha, color = C.paper, glow = C.gold, weight = 700) {
  if (alpha <= 0) return;
  ctx.save(); ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const lines = str.split('\n'), lh = size * 1.45, y0 = y - (lines.length - 1) * lh / 2;
  ctx.shadowColor = rgba(glow, 0.6 * alpha); ctx.shadowBlur = size * 0.45;
  ctx.fillStyle = rgba(color, alpha);
  lines.forEach((l, i) => ctx.fillText(l, W / 2, y0 + i * lh));
  ctx.restore();
}

const SUBS = [ // [開始, 結束, 字幕]
  [4.8, 7.6, '這裡是九曜界。'],
  [7.6, 11.0, '九條曜脈，維繫著\n生命、修行與空間。'],
  [11.2, 16.0, '修行者以「契點」連結曜脈，\n才能施展武技與靈印。'],
  [16.3, 19.1, '但如今，\n天墟裂口重新出現——'],
  [19.1, 22.2, '妖獸異化，遺跡甦醒，\n空間開始崩裂。'],
  [22.6, 26.3, '天玄院的新契修們，\n還不知道自己將看見什麼。'],
];

function drawSubtitles(t) {
  const any = SUBS.some(([a, b]) => t > a - 0.3 && t < b + 0.3);
  if (any) { // 字幕底襯，避免壓在山景上看不清
    const g = ctx.createLinearGradient(0, 1300, 0, 1620);
    g.addColorStop(0, 'rgba(4,6,8,0)'); g.addColorStop(0.5, 'rgba(4,6,8,0.55)'); g.addColorStop(1, 'rgba(4,6,8,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 1300, W, 320);
  }
  for (const [a, b, s] of SUBS) textBlock(s, 1460, 58, win(t, a, b, 0.35, 0.35), C.paper, C.gold, 600);
}

function renderFrame(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const shake = clamp(1 - (t - 16) / 1.2) * (t >= 16 ? 1 : 0) * 14;
  const zoom = 1 + 0.05 * ease((t - 11) / 5) - 0.05 * ease((t - 16) / 0.6);
  ctx.translate(W / 2 + Math.sin(t * 90) * shake, H / 2 + Math.cos(t * 77) * shake);
  ctx.scale(zoom, zoom); ctx.translate(-W / 2, -H / 2);

  drawBackground(t);
  drawMotes(t);
  drawRift(t);
  drawVeins(t);
  drawContract(t);
  drawMountains(t);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(grain, 0, 0, W, H);
  // 暗角
  const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);

  // 開場鉤子
  textBlock('如果世界的平衡，\n靠的是九條\n看不見的脈——', 860, 76, win(t, 0.4, 4.4, 0.8, 0.6));
  drawSubtitles(t);
  // 結尾懸念與標題
  textBlock('天墟——\n真的只是一道裂口嗎？', 560, 70, win(t, 26.6, 28.4, 0.4, 0.4), C.paper, C.red);
  const ta = win(t, 28.4, 31, 0.6, 1);
  textBlock('九曜：天墟', 540, 124, ta, mix(C.gold, C.paper, 0.35), C.gold, 900);
  textBlock('原創東方幻想 MMORPG・企劃中', 660, 40, ta * 0.85, C.paper, C.gold, 500);
  // 頭尾淡入淡出
  const fade = 1 - clamp(t / 0.4) + clamp((t - 29.4) / 0.6);
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${clamp(fade)})`; ctx.fillRect(0, 0, W, H); }
}

window.renderFrame = renderFrame;
window.DURATION = DURATION;
if (!/[?&]render=1/.test(location.search)) { // 直接開檔案時即時循環播放（無聲；有聲版請看 MP4）
  const start = performance.now();
  const loop = now => { renderFrame(((now - start) / 1000) % DURATION); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
